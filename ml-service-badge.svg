<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 110" width="860" height="110">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1a0f40"/>
    </linearGradient>
    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D2FF"/>
      <stop offset="50%"  stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="btnG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D2FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="btnGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typewriter clip -->
    <clipPath id="twClip">
      <rect id="twRect" x="0" y="0" width="0" height="110"/>
    </clipPath>

    <style>
      /* Border draw + pulse */
      .border {
        stroke-dasharray: 1940;
        stroke-dashoffset: 1940;
        animation: drawBorder 1.6s 0.1s ease forwards, pulseBorder 3s 1.9s ease-in-out infinite;
      }
      @keyframes drawBorder  { to { stroke-dashoffset: 0; } }
      @keyframes pulseBorder { 0%,100%{stroke-opacity:0.85} 50%{stroke-opacity:0.2} }

      /* Corner dots */
      .dot { opacity:0; animation: dotIn 0.35s ease forwards, dotPulse 2.8s ease-in-out infinite; }
      .d1  { animation-delay:0.2s,2s;  } .d2 { animation-delay:0.35s,2.1s; }
      .d3  { animation-delay:0.5s,2.2s;} .d4 { animation-delay:0.65s,2.3s; }
      @keyframes dotIn    { to { opacity:1; } }
      @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.15} }

      /* Typewriter */
      #twRect { animation: typeReveal 2.4s 0.6s cubic-bezier(0.4,0,0.2,1) forwards; }
      @keyframes typeReveal { 0%{width:0} 100%{width:860px} }

      /* Cursor blink */
      .cursor {
        opacity:0;
        animation: cursorShow 0.05s 3.1s forwards, cursorBlink 0.85s 3.1s step-end infinite;
      }
      @keyframes cursorShow  { to { opacity:1; } }
      @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

      /* Underline */
      .uline {
        opacity:0;
        animation: uGrow 1s 0.9s ease forwards, uShimmer 3s 2s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes uGrow    { 0%{opacity:0;transform:scaleX(0)} 100%{opacity:1;transform:scaleX(1)} }
      @keyframes uShimmer { 0%,100%{opacity:1} 50%{opacity:0.25} }

      /* Subtitle */
      .sub { opacity:0; animation: subIn 1s 3.3s ease forwards; }
      @keyframes subIn { to { opacity:0.75; } }

      /* Click pill */
      .pill       { opacity:0; animation: pillIn 0.8s 3.8s ease forwards; }
      .pill-text  { opacity:0; animation: pillIn 0.8s 3.8s ease forwards; }
      @keyframes pillIn { to { opacity:1; } }

      /* Arrow bounce on pill */
      .pill-arrow {
        opacity:0;
        animation: pillIn 0.8s 3.8s ease forwards, arrowBounce 1.2s 4.6s ease-in-out infinite;
      }
      @keyframes arrowBounce { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }

      /* Pill border glow pulse */
      .pill-border {
        opacity:0;
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: pillBorderDraw 0.6s 3.8s ease forwards, pillBorderPulse 2s 4.5s ease-in-out infinite;
      }
      @keyframes pillBorderDraw  { to { stroke-dashoffset:0; opacity:1; } }
      @keyframes pillBorderPulse { 0%,100%{stroke-opacity:1} 50%{stroke-opacity:0.3} }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="110" rx="8" fill="url(#bg)"/>

  <!-- Animated border frame -->
  <rect class="border" x="3" y="3" width="854" height="104" rx="8"
        fill="none" stroke="url(#borderG)" stroke-width="1.8"/>

  <!-- Corner dots -->
  <circle class="dot d1" cx="11" cy="11"  r="4" fill="#00D2FF"/>
  <circle class="dot d2" cx="849" cy="11" r="4" fill="#7B2FF7"/>
  <circle class="dot d3" cx="11" cy="99"  r="4" fill="#7B2FF7"/>
  <circle class="dot d4" cx="849" cy="99" r="4" fill="#00D2FF"/>

  <!-- ── Typewriter title (WHITE) ── -->
  <g clip-path="url(#twClip)">
    <text x="430" y="40" text-anchor="middle"
          font-family="'Segoe UI',Arial,sans-serif"
          font-size="23" font-weight="700" letter-spacing="0.5"
          fill="#ffffff" filter="url(#glow)">
      ⚡  Active Machine Learning Service
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="649" y="20" width="2.5" height="27" rx="1" fill="#00D2FF"/>

  <!-- Underline bar -->
  <rect class="uline" x="190" y="52" width="480" height="2" rx="1" fill="url(#borderG)"/>

  <!-- Subtitle (WHITE, slightly muted) -->
  <text class="sub" x="430" y="72" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" font-weight="400" letter-spacing="1.4"
        fill="#ffffff">
    Full Pipeline  ·  Visual Charts  ·  Benchmarks  ·  All 7 Diagrams
  </text>

  <!-- ── CLICK HERE pill button ── -->
  <!-- Pill background -->
  <rect class="pill" x="290" y="81" width="280" height="22" rx="11"
        fill="url(#btnG)" filter="url(#btnGlow)"/>
  <!-- Pill border -->
  <rect class="pill-border" x="290" y="81" width="280" height="22" rx="11"
        fill="none" stroke="url(#borderG)" stroke-width="1.4"/>
  <!-- Pill text (WHITE) -->
  <text class="pill-text" x="418" y="96" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="1.5"
        fill="#ffffff">
    CLICK HERE TO OPEN ML SERVICE
  </text>
  <!-- Animated arrow -->
  <text class="pill-arrow" x="556" y="96" text-anchor="start"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="700"
        fill="#00D2FF">
    →
  </text>
</svg>
