<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="60%" stop-color="#111E38" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Stat Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1200" height="280" rx="12" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="12" fill="none" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Subtle Ambient Glow Wave -->
  <path d="M 0 200 Q 300 170 600 220 T 1200 190" fill="none" stroke="url(#accentLine)" stroke-width="2" opacity="0.4" />

  <!-- Header Badge -->
  <g transform="translate(60, 36)">
    <rect width="230" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <text x="26" y="17" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="0.8">MACHINE LEARNING PIPELINE</text>
  </g>

  <!-- Title -->
  <text x="60" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    AI-Based Energy Consumption Prediction System
  </text>

  <!-- Subtitle -->
  <text x="60" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
    Next-Hour Residential Electricity Demand Forecasting via Tuned Random Forest
  </text>

  <!-- 4 Clean Stat Badges -->
  <!-- 1. Accuracy -->
  <g transform="translate(60, 175)">
    <rect width="250" height="65" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-transform="uppercase" letter-spacing="0.5">Prediction Accuracy</text>
    <text x="18" y="49" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">0.3239 kW MAE (+13.1%)</text>
  </g>

  <!-- 2. Dataset -->
  <g transform="translate(330, 175)">
    <rect width="250" height="65" rx="8" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-transform="uppercase" letter-spacing="0.5">UCI Benchmark Data</text>
    <text x="18" y="49" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2.07M Records (4 Years)</text>
  </g>

  <!-- 3. Compression -->
  <g transform="translate(600, 175)">
    <rect width="260" height="65" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-transform="uppercase" letter-spacing="0.5">Edge Regularization</text>
    <text x="18" y="49" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">88% Smaller (23.8 MB)</text>
  </g>

  <!-- 4. Integrity -->
  <g transform="translate(880, 175)">
    <rect width="260" height="65" rx="8" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A78BFA" text-transform="uppercase" letter-spacing="0.5">Evaluation Protocol</text>
    <text x="18" y="49" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">100% Causal (0 Leakage)</text>
  </g>
</svg>
