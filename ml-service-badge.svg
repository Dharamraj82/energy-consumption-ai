<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 100" width="860" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1a0f40"/>
    </linearGradient>
    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D2FF"/>
      <stop offset="50%"  stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="textG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D2FF"/>
      <stop offset="50%"  stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typewriter clip -->
    <clipPath id="twClip">
      <rect id="twRect" x="0" y="0" width="0" height="100"/>
    </clipPath>

    <style>
      /* Border draw + pulse */
      .border {
        stroke-dasharray: 1900;
        stroke-dashoffset: 1900;
        animation: drawBorder 1.8s 0.1s ease forwards, pulseBorder 3s 2s ease-in-out infinite;
      }
      @keyframes drawBorder  { to { stroke-dashoffset: 0; } }
      @keyframes pulseBorder {
        0%,100% { stroke-opacity: 0.9; }
        50%     { stroke-opacity: 0.25; }
      }

      /* Corner dots */
      .dot { opacity:0; animation: dotIn 0.4s ease forwards, dotPulse 2.5s ease-in-out infinite; }
      .d1  { animation-delay: 0.2s, 2s; } .d2 { animation-delay: 0.35s, 2.1s; }
      .d3  { animation-delay: 0.5s, 2.2s; } .d4 { animation-delay: 0.65s, 2.3s; }
      @keyframes dotIn    { to { opacity:1; } }
      @keyframes dotPulse { 0%,100%{ opacity:1; r:4; } 50%{ opacity:0.2; r:2; } }

      /* Typewriter reveal */
      #twRect { animation: typeReveal 2.5s 0.5s cubic-bezier(0.4,0,0.2,1) forwards; }
      @keyframes typeReveal { 0%{width:0} 100%{width:860px} }

      /* Cursor blink */
      .cursor {
        opacity:0;
        animation: cursorShow 0.1s 3.1s forwards, cursorBlink 0.85s 3.1s step-end infinite;
      }
      @keyframes cursorShow  { to { opacity:1; } }
      @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }

      /* Underline grow + shimmer */
      .uline {
        opacity:0;
        animation: uGrow 1.2s 0.8s ease forwards, uShimmer 3s 2.2s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes uGrow    { 0%{opacity:0;transform:scaleX(0)} 100%{opacity:1;transform:scaleX(1)} }
      @keyframes uShimmer { 0%,100%{opacity:1} 50%{opacity:0.3} }

      /* Subtitle fade */
      .sub { opacity:0; animation: subIn 1s 3.4s ease forwards; }
      @keyframes subIn { to { opacity:0.6; } }

      /* Arrow bounce */
      .arrow { animation: bounce 1.4s 3.8s ease-in-out infinite; }
      @keyframes bounce {
        0%,100% { transform: translateX(0); }
        50%     { transform: translateX(6px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="100" rx="8" fill="url(#bg)"/>

  <!-- Animated border -->
  <rect class="border" x="3" y="3" width="854" height="94" rx="8"
        fill="none" stroke="url(#borderG)" stroke-width="1.8"/>

  <!-- Corner dots -->
  <circle class="dot d1" cx="10"  cy="10"  r="4" fill="#00D2FF"/>
  <circle class="dot d2" cx="850" cy="10"  r="4" fill="#7B2FF7"/>
  <circle class="dot d3" cx="10"  cy="90"  r="4" fill="#7B2FF7"/>
  <circle class="dot d4" cx="850" cy="90"  r="4" fill="#00D2FF"/>

  <!-- Typewriter title -->
  <g clip-path="url(#twClip)">
    <text x="430" y="42" text-anchor="middle"
          font-family="'Segoe UI',Arial,sans-serif"
          font-size="22" font-weight="700"
          fill="url(#textG)" filter="url(#glow)">
      ⚡  Active Machine Learning Service
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="638" y="22" width="2.5" height="26" rx="1" fill="#00D2FF"/>

  <!-- Underline -->
  <rect class="uline" x="200" y="52" width="460" height="2" rx="1" fill="url(#borderG)"/>

  <!-- Subtitle + arrow -->
  <text class="sub" x="370" y="75" text-anchor="middle"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="12" font-weight="400" letter-spacing="1.2" fill="#a0c4ff">
    Full Pipeline · Visual Charts · Benchmarks
  </text>
  <text class="sub arrow" x="590" y="75" text-anchor="start"
        font-family="'Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="600" fill="#00D2FF">
    → Open ml-service/
  </text>
</svg>
