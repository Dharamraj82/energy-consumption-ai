<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0A2540" />
    </linearGradient>

    <!-- Accent Energy Glow Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="340" rx="12" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="12" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="250" y1="0" x2="250" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="550" y1="0" x2="550" y2="340" />
    <line x1="700" y1="0" x2="700" y2="340" />
    <line x1="850" y1="0" x2="850" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
    <line x1="1150" y1="0" x2="1150" y2="340" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Energy Power Pulse Waveform Graphic in Background -->
  <path d="M 0 250 Q 150 240 250 260 T 450 230 T 600 270 T 750 190 T 900 250 T 1050 210 T 1200 240" fill="none" stroke="url(#energyGrad)" stroke-width="3" filter="url(#glow)" opacity="0.65" />
  <path d="M 0 260 Q 120 270 280 230 T 520 280 T 720 180 T 880 260 T 1040 190 T 1200 250" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4" />

  <!-- Top Pill Tag -->
  <g transform="translate(60, 42)">
    <rect width="260" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4.5" fill="#10B981" />
    <text x="30" y="20" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">MACHINE LEARNING PIPELINE</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="125" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    AI-Based Energy Consumption Prediction
  </text>

  <!-- Subtitle -->
  <text x="60" y="165" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    Next-Hour Residential Electricity Demand Forecasting via Tuned Random Forest
  </text>

  <!-- Feature Badges Row -->
  <!-- Badge 1: Accuracy Gain -->
  <g transform="translate(60, 205)">
    <rect width="250" height="52" rx="8" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-transform="uppercase" letter-spacing="0.5">PREDICTION ACCURACY</text>
    <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">0.3239 kW MAE (+13.1%)</text>
  </g>

  <!-- Badge 2: Dataset -->
  <g transform="translate(325, 205)">
    <rect width="250" height="52" rx="8" fill="url(#badgeGrad)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399" text-transform="uppercase" letter-spacing="0.5">UCI SMART METER DATA</text>
    <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2.07M Records (4 Years)</text>
  </g>

  <!-- Badge 3: Edge Compression -->
  <g transform="translate(590, 205)">
    <rect width="260" height="52" rx="8" fill="url(#badgeGrad)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F59E0B" text-transform="uppercase" letter-spacing="0.5">EDGE-READY REGULARIZATION</text>
    <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">88% Smaller (23.8 MB)</text>
  </g>

  <!-- Badge 4: Integrity -->
  <g transform="translate(865, 205)">
    <rect width="275" height="52" rx="8" fill="url(#badgeGrad)" stroke="#A78BFA" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A78BFA" text-transform="uppercase" letter-spacing="0.5">EVALUATION STANDARD</text>
    <text x="16" y="44" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">100% Causal (0 Data Leak)</text>
  </g>

  <!-- Bottom Mini Footer / Tech Stack -->
  <text x="60" y="305" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748B">
    Python 3.14  •  Scikit-Learn 1.8  •  Pandas 3.0  •  NumPy 2.4  •  Strict Chronological Split (70/15/15)
  </text>
</svg>
